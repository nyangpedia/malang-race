<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>말랑 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3f3; --bg2:#e3e8ff; --ink:#3d2a55; --ink2:#7a63a0; --card:#ffffffee; --line:#eadcff;
  --pink:#ff6fae; --pink2:#ff9ccf; --blue:#4fb8ff; --yellow:#ffd23f; --green:#40c98b; --purple:#9b7bff; --red:#ff5a7a;
  --shadow:0 6px 0 rgba(120,80,170,.18), 0 10px 24px rgba(120,80,170,.18);
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --card:#ffffffee; } }
:root[data-theme="dark"]{ --card:#ffffffee; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:var(--font);color:var(--ink);touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:inherit}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:22px;font-size:20px;background:linear-gradient(180deg,#ff8cc4,#ff5fa2);color:#fff;box-shadow:0 6px 0 #d8407f,0 10px 20px rgba(255,95,162,.35);transition:transform .08s;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d8407f}
.btn.blue{background:linear-gradient(180deg,#7fd0ff,#3fa9ff);box-shadow:0 6px 0 #2a83d0,0 10px 20px rgba(63,169,255,.3)}
.btn.yellow{background:linear-gradient(180deg,#ffe17a,#ffc21f);color:#5a3a00;box-shadow:0 6px 0 #d89a00,0 10px 20px rgba(255,194,31,.3);text-shadow:none}
.btn.green{background:linear-gradient(180deg,#6fe0ad,#2fbf7f);box-shadow:0 6px 0 #1f9460}
.btn.gray{background:linear-gradient(180deg,#e6e0f0,#cfc6e0);color:#6a5a85;box-shadow:0 6px 0 #aa9fc0;text-shadow:none}
.btn.sm{padding:9px 16px;font-size:16px;border-radius:16px}
.btn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px}
/* ---- title ---- */
#screen-title .logo{font-size:clamp(54px,14cqw,108px);line-height:1;letter-spacing:2px;color:#fff;text-align:center;
  -webkit-text-stroke:3px #b0408a;text-shadow:0 5px 0 #b0408a,0 10px 0 rgba(120,40,110,.35),0 0 30px rgba(255,150,210,.8);
  background:none;transform:rotate(-3deg);animation:wob 2.4s ease-in-out infinite}
#screen-title .logo span:nth-child(1){color:#ff7eb6}#screen-title .logo span:nth-child(2){color:#ffd23f}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-1deg) scale(1.04,0.97)}}
#screen-title .sub{margin:22px 0 30px;font-size:20px;color:var(--ink2);background:#fff9;padding:8px 18px;border-radius:999px}
#screen-title .en{font-size:18px;letter-spacing:6px;color:#9b7bff;margin-top:6px}
/* ---- register ---- */
.reg{width:min(520px,100%);max-height:100%;overflow:auto}
.reg h2{margin:0 0 6px;font-size:28px;text-align:center}
.reg p.note{font-size:14px;color:var(--ink2);text-align:center;margin:0 0 14px}
.field{margin:14px 0}
.field label{display:block;font-size:17px;margin-bottom:8px}
.field input{width:100%;font-size:22px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);outline:none;color:var(--ink);background:#fff}
.field input:focus{border-color:var(--pink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:14px;background:#f3ecff;font-size:18px;border:3px solid transparent}
.chip.on{background:#fff;border-color:var(--pink);color:#d8407f}
.lvcards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lvcard{padding:10px;border-radius:16px;background:#f6f0ff;text-align:left;border:3px solid transparent;position:relative}
.lvcard.on{border-color:var(--purple);background:#fff}
.lvcard b{font-size:18px;display:block}.lvcard small{font-size:12px;color:var(--ink2)}
.rec{position:absolute;top:-8px;right:-4px;background:var(--yellow);color:#5a3a00;font-size:11px;padding:2px 7px;border-radius:9px}
/* ---- hub ---- */
#screen-hub{justify-content:flex-start;gap:10px;align-items:stretch;pointer-events:none}
#screen-hub > *{pointer-events:auto}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:#fffd;border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 rgba(120,80,170,.15);font-size:16px;display:flex;align-items:center;gap:6px}
.pill.me{font-size:18px}
.xpbar{width:90px;height:10px;border-radius:9px;background:#eadcff;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ccf,#ff5fa2)}
.hub-bottom{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(640px,100%)}
.mbtn{background:#fffe;border-radius:20px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;box-shadow:0 4px 0 rgba(120,80,170,.18);position:relative}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,80,170,.18)}
.mbtn .ic{font-size:28px;line-height:1.1}
.mbtn .dot{position:absolute;top:6px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.race-btn{width:min(640px,100%);font-size:26px;padding:16px}
.daily{position:absolute;right:16px;top:70px;width:220px;font-size:14px;padding:12px}
.daily h4{margin:0 0 6px;font-size:16px}
.mission{display:flex;align-items:center;gap:6px;margin:5px 0}
.mission .bar{flex:1;height:8px;background:#eee4ff;border-radius:8px;overflow:hidden}.mission .bar i{display:block;height:100%;background:var(--green)}
.hub-tip{font-size:13px;color:var(--ink2);background:#fff9;border-radius:12px;padding:4px 10px}
@container stage (max-width:720px){ .daily{position:static;width:auto;margin-top:8px;padding:8px 12px;font-size:12px;border-radius:18px} .daily h4{font-size:13px;margin:0 0 2px;display:inline;margin-right:6px} .daily .mission{display:inline-flex;margin:2px 8px 2px 0} .daily .mission span:first-child{width:auto!important} .daily .mission .bar{display:none} .daily .btn.sm{padding:3px 8px;font-size:12px} .menu{grid-template-columns:repeat(4,1fr)} .mbtn{font-size:12px} .mbtn .ic{font-size:24px} .race-btn{font-size:22px;padding:13px} .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))} .item{min-height:72px;font-size:12px} }
.sticky{position:sticky;bottom:-22px;background:linear-gradient(180deg,rgba(255,253,253,0),#fffdfd 30%);padding:14px 0 12px;margin-bottom:-12px}
@container stage (max-width:720px){ .world{min-height:86px;padding:10px} .world b{font-size:17px} .panel h2{font-size:22px} }
.modal-side .hub-hint{visibility:hidden}
body:has(#modal:not(.hidden)) #controls{display:none}

/* ---- lobby v5 ---- */
.blob{display:inline-block;width:46px;height:42px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;background:radial-gradient(circle at 32% 26%,#fffc 0 12%,transparent 30%),var(--c,#ff7eb6);position:relative;box-shadow:inset 0 -7px 0 #0000001c,0 3px 0 #0000001a;border:3px solid #fff;flex:none}
.blob::before,.blob::after{content:'';position:absolute;top:52%;width:13%;height:15%;border-radius:50%;background:#3a2350}
.blob::before{left:27%}.blob::after{right:27%}
.blob.big{width:92px;height:84px;border-width:5px}
.blob.boing{animation:boing .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{transform:scale(1.25,.7)}50%{transform:scale(.9,1.15)}100%{transform:scale(1)}}
.regcolor{display:flex;align-items:center;gap:16px}
.swatches{display:grid;grid-template-columns:repeat(4,44px);gap:10px}
.sw{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fffb 0 14%,transparent 34%),var(--c);border:4px solid #fff;box-shadow:0 3px 0 rgba(120,80,170,.25)}
.sw.on{outline:4px solid var(--pink);transform:scale(1.1)}
.admin-badge{display:block;width:max-content;margin-bottom:2px;background:linear-gradient(180deg,#3d2a55,#5b3f86);color:#ffd23f;font-weight:800;font-size:13px;border-radius:12px;padding:4px 12px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:2px solid #ffd23f}
#hub-top.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.pcard{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#ffffffee,#fff5fbdd);border-radius:24px;padding:8px 16px 8px 10px;box-shadow:0 5px 0 rgba(120,80,170,.16),0 10px 24px rgba(120,80,170,.16);border:3px solid #fff;justify-self:start;backdrop-filter:blur(6px)}
.pc-t{display:flex;flex-direction:column;gap:3px}.pc-t b{font-size:19px;line-height:1}.pc-lv{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.hub-title{font-size:26px;color:#fff;-webkit-text-stroke:1.5px #b0408a;text-shadow:0 3px 0 #b0408a,0 0 18px #ffb3e0;letter-spacing:3px;padding-top:6px;white-space:nowrap}
.pills{display:flex;gap:8px;justify-self:end;flex-wrap:wrap;justify-content:flex-end}
.pill{border:3px solid #fff;backdrop-filter:blur(6px)}.pill.en{background:linear-gradient(180deg,#fff7c9,#ffe17a);color:#6a4500}
.menu{grid-template-columns:repeat(7,1fr);width:min(760px,100%);background:#ffffffb8;border-radius:28px;padding:10px 8px 8px;border:3px solid #fff;box-shadow:0 6px 0 rgba(120,80,170,.14),0 14px 30px rgba(120,80,170,.2);backdrop-filter:blur(8px)}
.mbtn{background:none;box-shadow:none;padding:2px;gap:5px;font-size:13px;border-radius:16px}
.mbtn:active{transform:translateY(3px);box-shadow:none}
.mbtn .ic{width:52px;height:52px;border-radius:19px;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 -5px 0 #00000022,0 4px 0 rgba(120,80,170,.2);border:3px solid #fff}
.mbtn .lb{white-space:nowrap}
.mbtn .dot{top:0;right:8px;border:2px solid #fff;width:14px;height:14px}
.race-btn{position:relative;overflow:hidden;width:min(460px,100%);display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:30px;color:#fff;text-align:left;background:linear-gradient(180deg,#ff9ccf,#ff4f9a);border:4px solid #fff;box-shadow:0 8px 0 #c93a7d,0 16px 30px rgba(255,79,154,.45);animation:rbp 1.8s ease-in-out infinite}
.race-btn::after{content:'';position:absolute;top:-20%;left:-40%;width:30%;height:140%;background:linear-gradient(90deg,transparent,#ffffff88,transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-40%}100%{left:130%}}
@keyframes rbp{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.race-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #c93a7d;animation:none}
.rb-ic{font-size:40px}.rb-t{display:flex;flex-direction:column;flex:1}.rb-t b{font-size:28px;line-height:1.1;text-shadow:0 2px 0 #0002}.rb-t small{font-size:13px;opacity:.95}
.rb-go{width:46px;height:46px;border-radius:50%;background:#fff;color:#ff4f9a;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -4px 0 #0001}
.daily{top:86px;border:3px solid #fff;background:#ffffffd8;backdrop-filter:blur(6px)}
@container stage (max-width:720px){
  #hub-top.topbar{grid-template-columns:1fr auto}.hub-title{display:none}.pills .pill{font-size:13px;padding:5px 10px}.pc-t b{font-size:16px}
  .menu{grid-template-columns:repeat(4,1fr);row-gap:8px}.mbtn .ic{width:46px;height:46px;font-size:24px}.mbtn{font-size:12px}
  .rb-t b{font-size:24px}.rb-ic{font-size:32px}
  #hub-daily.daily{position:absolute;right:12px;top:calc(max(16px,env(safe-area-inset-top)) + 122px);width:132px;margin:0;padding:7px 9px;font-size:11px;border-radius:16px}#hub-daily h4{display:block;font-size:12px;margin:0 0 3px}#hub-daily .mission{display:flex;margin:2px 0;gap:4px}#hub-daily .mission span:first-child{width:auto!important;flex:1}#hub-daily .mission .bar{display:none}#hub-daily .btn.sm{padding:2px 7px;font-size:11px;box-shadow:none}
}
.hub-hint{align-self:center;background:#ffffffd9;border:3px solid #fff;border-radius:999px;padding:7px 18px;font-size:15px;color:var(--ink);box-shadow:0 4px 0 rgba(120,80,170,.15);text-align:center;max-width:min(92cqw,560px);pointer-events:none!important}
.pill.gear{font-size:20px;padding:5px 11px;cursor:pointer}
.mission.big{font-size:17px;gap:10px;margin:10px 0}.mission.big .ml{width:150px}.mission.big .bar{height:12px}
@container stage (max-width:720px){ .hub-hint{font-size:12px;padding:5px 12px} .mission.big .ml{width:110px;font-size:14px} }
.ms-sub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sj{background:#f3ecff;border-radius:14px;padding:7px 2px;font-size:13px;border:3px solid transparent;white-space:nowrap}.sj.on{background:#fff;border-color:var(--pink);color:#d8407f}
.q-chips{flex-wrap:wrap}
/* ---- world map ---- */
#screen-map{background:radial-gradient(ellipse at 50% 30%,#8fe0ff,#4fb4f2 60%,#3a95e0);justify-content:flex-start;gap:0;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:6}
.map-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}
.map-title{font-size:clamp(20px,4.6cqw,30px);color:#fff;-webkit-text-stroke:1.5px #1f6fb8;text-shadow:0 3px 0 #1f6fb8;white-space:nowrap}
#map-svg{flex:1;min-height:0;width:100%;display:flex}
#map-svg svg{width:100%;height:100%;font-family:var(--font);overflow:visible}
#map-svg .isl{cursor:pointer}
#map-svg .bob{animation:bobI 4.2s ease-in-out infinite}
@keyframes bobI{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#map-svg .isl.locked .deco{filter:grayscale(1);opacity:.55}
#map-svg .isl.locked ellipse[fill^="url"]{filter:grayscale(.85)}
#map-svg .selring{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
#map-svg .mapme{animation:mhop .9s ease-in-out infinite}
@keyframes mhop{0%,100%{transform:translateY(0) scale(1.05,.95)}50%{transform:translateY(-16px) scale(.97,1.05)}}
#map-svg .drift{animation:bobI 5s ease-in-out infinite}
#map-svg .mcloud{animation:mcl 40s linear infinite}
@keyframes mcl{from{transform:translateX(-200px)}to{transform:translateX(1500px)}}
#map-sheet{width:min(720px,100%);display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px 16px;z-index:2;border:3px solid #fff}
#map-sheet.closed{width:auto;padding:10px 18px}.ms-hint{font-size:18px;font-weight:800;color:#3d2a55;animation:mhop 1.2s ease-in-out infinite}
.ms-ask{text-align:center;font-weight:800;font-size:15px;color:#3d2a55}
.ms-sub.big{grid-template-columns:repeat(3,1fr);gap:8px}.ms-sub.big .sj{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;font-size:15px;border:none;border-radius:16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45);transform:translateY(0);transition:transform .12s}
.ms-sub.big .sj i{font-style:normal;font-size:28px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}.ms-sub.big .sj:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.ms-sub.big .sj-math,.ms-sub.big .sj-math.on{background:linear-gradient(180deg,#ffa06b,#ff6f61)}.ms-sub.big .sj-english,.ms-sub.big .sj-english.on{background:linear-gradient(180deg,#6fd0ff,#3f8cff)}.ms-sub.big .sj-quiz,.ms-sub.big .sj-quiz.on{background:linear-gradient(180deg,#9be35a,#3fb86a)}.ms-sub.big .sj:not(.on){opacity:.82}.ms-sub.big:not(:has(.on)) .sj{opacity:1}
.ms-sub.big .sj.on{outline:4px solid #fff;outline-offset:-4px;transform:translateY(-3px) scale(1.05);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 0 4px #ff5fa2}
.go-pop{animation:gopop .35s ease-out}@keyframes gopop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
#map-svg .ripple{animation:ripple 3s ease-out infinite;transform-origin:0 62px}@keyframes ripple{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.15);opacity:0}}
#map-svg svg{transform:perspective(1600px) rotateX(12deg);transform-origin:50% 70%}
.ms-head{display:flex;gap:12px;align-items:center}.ms-ic{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-size:32px;border:3px solid #fff;box-shadow:0 4px 0 rgba(120,80,170,.2);flex:none}
.ms-t b{font-size:22px;display:block}.ms-t small{font-size:13px;color:var(--ink2)}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px}.ms-chips span{background:#f3ecff;border-radius:12px;padding:4px 10px;font-size:13px}
.ms-note{font-size:12px;color:var(--ink2);text-align:center}
#map-sheet{position:absolute;left:16px;bottom:16px;width:min(340px,31cqw)}
/* ---- modal ---- */
#modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(60,30,90,.35);padding:16px;backdrop-filter:blur(3px)}
#modal.side{background:transparent;backdrop-filter:none;align-items:flex-end;pointer-events:none}
#modal .panel{width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;background:#fffdfd;border-radius:28px;box-shadow:var(--shadow);padding:18px 18px 22px;position:relative;pointer-events:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#modal.side .panel{max-height:58%;}
.panel h2{margin:0 0 12px;font-size:26px;display:flex;align-items:center;gap:8px}
.panel .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:#f3ecff;font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{padding:8px 13px;border-radius:14px;background:#f3ecff;white-space:nowrap;font-size:15px}
.tab.on{background:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.item{background:#f8f3ff;border-radius:18px;padding:10px 6px;text-align:center;border:3px solid transparent;font-size:14px;position:relative;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.item.on{border-color:var(--pink);background:#fff}
.item.locked{opacity:.65}
.item .sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.item .pr{font-size:13px;color:#b07a00}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:14px}
.wn{border-radius:18px;background:#f8f3ff;padding:12px;margin:8px 0}
.wn .q{font-size:22px}
.wn .meta{font-size:13px;color:var(--ink2)}
.tag{display:inline-block;padding:2px 8px;border-radius:9px;background:#efe6ff;font-size:12px;margin-right:4px}
.tag.red{background:#ffe0e6;color:#d0304f}.tag.green{background:#dcf7ea;color:#1f8a5a}
.statbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.statbar > span:first-child{flex:0 0 40%;width:auto!important}.statbar > span:last-child{flex:0 0 auto;width:auto!important;min-width:60px}.statbar .b{flex:1;height:14px;border-radius:9px;background:#efe6ff;overflow:hidden}.statbar .b i{display:block;height:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{font-size:26px;padding:16px;border-radius:18px;background:#f3ecff;box-shadow:0 4px 0 #d9ccef}
.choice.ok{background:#c9f5df}.choice.no{background:#ffd6de}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.world{border-radius:22px;padding:14px;color:#fff;text-align:left;position:relative;min-height:120px;box-shadow:0 5px 0 rgba(0,0,0,.12);border:4px solid transparent}
.world.on{border-color:#fff;outline:3px solid var(--pink)}

.emotes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}.emotes button{font-size:26px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(120,80,170,.18)}.emotes button:active{transform:scale(.9)}
#roomhud{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 196px);z-index:10;background:#ffffffde;border-radius:16px;padding:6px 10px;font-size:13px;min-width:150px;pointer-events:none;box-shadow:0 3px 0 rgba(120,80,170,.15)}
#roomhud div,.room-board div{display:flex;gap:6px;align-items:center;padding:2px 0}#roomhud span,.room-board span{width:30px;color:#ff5fa2;font-weight:bold}#roomhud em,.room-board em{margin-left:auto;font-style:normal;color:var(--ink2)}#roomhud .me,.room-board .me{color:#d8407f;font-weight:bold}
.room-board{font-size:16px}
#emotebar{position:fixed;right:max(12px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:16;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
#emotebar .eb-t{font-size:28px;width:52px;height:52px;border-radius:50%;background:#fffe;box-shadow:0 3px 0 rgba(120,80,170,.2)}#emotebar .eb-row{display:none;flex-direction:column;margin:0}#emotebar.open .eb-row{display:flex}
#roomcall{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 14px);z-index:14;display:flex;align-items:center;gap:10px;background:#fff;border:4px solid #9fe3ff;border-radius:999px;padding:6px 8px 6px 12px;box-shadow:var(--shadow);font-size:16px;white-space:nowrap}
#roomcall .rc-x{width:30px;height:30px;border-radius:50%;background:#f3ecff;font-size:14px}
body:has(#modal:not(.hidden)) #roomcall{display:none}
@container stage (max-height:520px){ #roomhud{top:calc(max(6px,env(safe-area-inset-top)) + 150px);font-size:11px;min-width:120px;padding:4px 8px} .ol-stats{grid-template-columns:repeat(5,1fr)} .emotes button{width:40px;height:40px;font-size:22px} #emotebar .eb-t{width:44px;height:44px;font-size:24px} }

/* phones held sideways: keep the plaza and the race view clear */
@container stage (max-height:430px){
  #hub-top .pcard{padding:3px 10px 3px 4px;gap:6px;border-width:2px;border-radius:16px}#hub-top .pcard .blob{width:28px;height:26px}.pc-t{gap:1px}.pc-t b{font-size:13px}.pc-lv{font-size:10px}.pc-lv .xpbar{width:46px}
  .admin-badge{font-size:10px;padding:1px 7px;border-width:1px;border-radius:8px}
  .pills{gap:4px}.pills .pill{font-size:11px;padding:3px 8px;border-width:2px}
  .hub-hint{display:none}
  #leaderboard.lb-c{max-width:112px;font-size:10px}
  #hud-rank{font-size:20px;padding:1px 10px}#hud-rank small{font-size:11px}
  #hud-gap{font-size:11px}
}
/* world map: the subject panel opens in the middle of the screen */
#map-dim{position:absolute;inset:0;background:#2a1b4a55;z-index:2;opacity:0;pointer-events:none;transition:opacity .2s}
#map-dim.on{opacity:1;pointer-events:auto}
#map-sheet.center{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(440px,92cqw);max-height:94cqh;overflow:auto;z-index:3;box-shadow:0 12px 40px rgba(40,20,80,.35);animation:sheetIn .22s ease-out}
@keyframes sheetIn{from{transform:translate(-50%,-44%) scale(.92);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#map-sheet .ms-x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#f3ecff;font-size:16px;line-height:30px;text-align:center}
#map-sheet.closed{left:50%;bottom:12px;transform:translateX(-50%)}
@container stage (max-height:430px){ #map-sheet.center{width:min(400px,70cqw);padding:8px 12px;gap:5px} #map-sheet.center .ms-chips{display:none} .ms-sub.big .sj{padding:6px 2px 5px;font-size:13px} .ms-sub.big .sj i{font-size:22px} }

/* phones: the ranking box steps aside while a question is up */
@container stage (max-height:500px){ #leaderboard.q-hide{display:none} }
@container stage (max-width:600px){ #leaderboard.q-hide{display:none} }
.hud-chip:empty,#hud-gap{display:none!important}
canvas{touch-action:none}
.consent-grid .pins{display:flex;gap:10px}.consent-grid .pins .field{flex:1}
/* phones held sideways: windows fit on one screen without scrolling */
@container stage (max-height:500px){
  #modal{padding:6px}
  #modal.side{align-items:stretch;justify-content:flex-end}
  #modal.side .panel{max-height:none;height:calc(100% - 4px);width:min(560px,64%)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}.item{min-height:64px;padding:6px 4px;font-size:12px;border-radius:14px}
  .switch{padding:4px 0!important;min-height:0}
  .lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lv-grid h3{margin:4px 0;font-size:15px}.statbar{font-size:12px;margin:2px 0}.lv-grid .statbar span:first-child{width:auto!important;flex:1}
  .panel h3{font-size:15px;margin:6px 0 4px}.panel p{margin:4px 0;font-size:12px}
  .wn{padding:6px 10px!important}.wn .q{font-size:17px!important}
  #modal .panel{padding:10px 14px 12px;border-radius:20px;max-height:calc(100% - 4px)}
  .panel h2{font-size:19px;margin:0 0 6px;padding-right:36px}
  .panel .x{width:32px;height:32px;top:8px;right:8px;font-size:17px}
  .field{margin:5px 0}.field label{font-size:13px;margin-bottom:3px}.field input{font-size:16px;padding:6px 10px;border-radius:12px;border-width:2px}
  .panel .btn{font-size:16px;padding:8px 16px}.panel .btn.sm{font-size:14px;padding:6px 12px}
  .panel .row{margin-top:4px;gap:8px}
  .ol-consent{font-size:11.5px;line-height:1.5;padding:8px 10px;border-radius:12px}.ol-consent b{min-width:0;display:block;margin-top:3px}.ol-consent b:first-child{margin-top:0}
  .ol-check{font-size:13px;margin:4px 0;gap:6px;line-height:1.3}.ol-check input{width:18px;height:18px}
  .consent-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}
  .ol-msg{font-size:13px;min-height:0}
  .tabs{margin-bottom:4px;padding-bottom:3px}.tab{padding:5px 10px;font-size:13px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="fever" class="hidden"></button><div id="fever-mini" class="hidden"></div>
<div id="loading">말랑이들을 깨우는 중…</div>

<section id="screen-title" class="screen hidden">
  <div class="logo"><span>말랑</span><span>레이스</span></div>
  <div class="en">MALANG RACE</div>
  <div class="sub">숫자 에너지를 되살리는 말랑이들의 대모험!</div>
  <button class="btn" id="btn-start" style="font-size:26px;padding:16px 46px">시작하기</button>
  <button class="btn blue hidden" id="btn-online" style="font-size:18px;padding:11px 26px">👨‍👩‍👧 보호자 계정으로 하기</button>
  <div class="title-online" id="title-online"></div>
</section>

<section id="screen-register" class="screen hidden">
  <div class="card reg">
    <h2>나만의 말랑이 등록</h2>
    <p class="note" id="reg-note">실명 대신 별명을 써 주세요. 정보는 이 기기에만 저장돼요.</p>
    <div class="field"><label>닉네임 (2~8글자)</label><input id="reg-nick" maxlength="8" placeholder="예: 별빛말랑" autocomplete="off"></div>
    <div class="field"><label>말랑이 색 고르기 <span class="muted" id="reg-cname"></span></label><div class="regcolor"><span class="blob big" id="reg-blob"></span><div class="swatches" id="reg-color"></div></div></div>
    <div class="field"><label>나이</label><div class="chips" id="reg-age"></div></div>
    <div class="field"><label>시작 수학 레벨 <span class="muted">(나이로 추천해요. 실력에 맞게 바꿔도 돼요)</span></label><div class="lvcards" id="reg-level"></div></div>
    <div style="text-align:center;margin-top:14px"><button class="btn" id="btn-reg">말랑 행성으로 출발!</button></div>
  </div>
</section>

<section id="screen-hub" class="screen hidden">
  <div class="topbar" id="hub-top"></div>
  <div class="hub-hint" id="hub-hint"></div>
</section>

<section id="screen-map" class="screen hidden">
  <div class="map-top"><button class="btn sm gray" id="map-back">← 광장</button><div class="map-title">🗺️ 말랑 행성 지도</div><div class="pill en" id="map-energy"></div></div>
  <div id="map-svg"></div>
  <div id="map-dim"></div><div class="card" id="map-sheet"></div>
</section>

<div id="hud" class="hidden">
  <div class="hud-tl"><div id="hud-rank"></div><div class="hud-chip" id="hud-sec"></div><div class="hud-chip" id="hud-energy"></div><div class="hud-chip" id="hud-gap"></div><div class="hud-chip" id="hud-combo" style="background:#ffe17a"></div></div>
  <div class="hud-tc"><div id="hud-time">00:00</div><div class="prog"><div id="prog-marks"></div><div id="prog-lead"></div><div id="prog-me"></div><span class="flag">🏁</span></div><div class="hud-chip" id="hud-world" style="font-size:13px"></div><div class="hud-chip" id="hud-sim" style="font-size:12px;opacity:.85"></div></div>
  <div class="hud-tr"><button id="pausebtn">⏸</button><div id="leaderboard" class="lb-c" title="눌러서 순위 더 보기"></div></div>
</div>
<div id="qpanel" class="hidden"></div>
<div id="roomhud" class="hidden"></div><div id="emotebar" class="hidden"></div><div id="roomcall" class="hidden"></div>
<div id="bigmsg" class="hidden"></div>
<div id="toasts"></div>
<div id="controls" class="hidden">
  <div id="stickzone"><div id="stick"><i id="knob"></i></div>
  </div>
  <div class="jump" data-btn="jump">점프</div>
  <div class="kbd-hint">W A S D / 방향키 이동 · Space 점프 · Esc 일시정지</div>
</div>
<div id="modal" class="hidden"><div class="panel" id="modal-panel"></div></div>

<script>/*THREE*/</script>
<script>/*SUPABASE*/</script>
<script>/*GAME*/</script>
</body>
</html>
